name: build-push
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read 

env:
    AWS_REGION: eu-west-2
jobs:
  build-push:
    name: build and push docker image to aws ECR
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4 
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{secrets.AWS_ACCOUNT_ID}}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR Private
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image locally
        env:
            ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
            ECR_REPOSITORY: ${{secrets.ECR_REPO}}
            tags: ${{ secrets.IMAGE_URI }}
        run: |
         docker buildx build -t $ECR_REPOSITORY:${{ github.sha }} \
         --platform linux/amd64 \
         --load \
         -f app/Dockerfile \
         ./app

      - name: Grype container scanner   
        uses: anchore/scan-action@v7
        with:
          image: ${{secrets.ECR_REPO}}:${{ github.sha }}
          fail-build: false
          
          
      - name: Push Docker Image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPO }}
        run: |
          echo "Tagging Docker image for ECR"

          docker tag \
            $ECR_REPOSITORY:${{ github.sha }} \
            $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}

          echo "Pushing Docker image to ECR"

          docker push $ECR_REGISTRY/$ECR_REPOSITORY:${{github.sha}}

          echo "Push successful"

      - name: Update ECS service
        env:
          ECS_CLUSTER: gatus-ecs
          ECS_SERVICE: gatus
        run: |
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service $ECS_SERVICE \
            --force-new-deployment
            echo "ECS task updated!"
