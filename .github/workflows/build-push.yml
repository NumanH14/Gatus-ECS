name: build-push
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read 

env:
    AWS_REGION: eu-west-2

jobs:
  build-push:
    name: build and push docker image to aws ECR
    runs-on: ubuntu-latest
    steps:
      -
        name: checkout code
        uses: actions/checkout@v4 
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{secrets.AWS_ACCOUNT_ID}}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR Private
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image locally
        env:
            ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
            ECR_REPOSITORY: ${{secrets.ECR_REPO}}
            tags: ${{ secrets.IMAGE_URI }}
        run: |
         docker buildx build -t $ECR_REPOSITORY:${{ github.sha }} \
         --platform linux/amd64 \
         --load \
         -f app/Dockerfile \
         ./app

      - name: Grype container scanner   
        uses: anchore/scan-action@v7
        with:
          image: ${{secrets.ECR_REPO}}:${{ github.sha }}
          fail-build: false


      - name: Push Docker Image to ECR
        run: |
            echo "Pushing Docker image to ECR"
            docker push $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}
            echo "Push successful"


      - name: Update ECS service
        env:
            ECS_SERVICE: gatus-service           
            ECS_CLUSTER: gatus-cluster                
            ECS_TASK_DEFINITION: gatus-ecs
            CONTAINER_NAME: gatus-image
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@c804dfbdd57f713b6c079302a4c01db7017a36fc
        with:
          task-definition: ${{ env.ECS_TASK_DEFINITION }}
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ secrets.IMAGE_URI }}

      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@df9643053eda01f169e64a0e60233aacca83799a
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true